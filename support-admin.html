<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت پشتیبانی | آکادمی</title>
<style>
:root{--cream:#f6efdf;--paper:#fffaf0;--gold:#a87928;--brown:#705638;--ink:#403426;--muted:#796b58;--line:#e8dcc7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px/2 Tahoma,Arial}header{background:var(--paper);padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.wrap{max-width:1100px;margin:25px auto;padding:0 14px}h1{font-size:21px;color:var(--brown)}.ticket{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:17px;margin:13px 0}.meta{font-size:12px;color:var(--muted)}.message{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8f1e4;padding:12px;border-radius:9px;margin:12px 0}textarea,select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white;font:13px Tahoma;margin:5px 0 10px}button{background:var(--gold);color:white;border:0;border-radius:8px;padding:10px 16px;font:13px Tahoma;cursor:pointer;margin:4px}.status{color:var(--brown);white-space:pre-wrap}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.pill{display:inline-block;background:#efe3cc;color:#795b2b;padding:2px 9px;border-radius:30px;font-size:11px;margin:2px}.ticket-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}}@media(max-width:430px){.filters{grid-template-columns:1fr}}
</style></head><body>
<header><strong>✧ مدیریت درخواست‌های پشتیبانی</strong><a href="admin.html" style="color:var(--brown)">بازگشت به مدیریت ←</a></header>
<main class="wrap"><h1>مرکز مدیریت پیام‌ها</h1><p class="meta">پیام‌ها بر اساس وضعیت، موضوع و نوع فرستنده جدا می‌شوند. مهمان یعنی درخواست بدون حساب کاربری؛ هنرجو یعنی درخواست ثبت‌شده از حساب واردشده.</p>
<div class="filters">
<label>وضعیت<select id="filterStatus"><option value="all">همه وضعیت‌ها</option><option value="open">جدید</option><option value="in_progress">در حال بررسی</option><option value="answered">پاسخ داده‌شده</option><option value="closed">بسته‌شده</option></select></label>
<label>موضوع<select id="filterCategory"><option value="all">همه موضوع‌ها</option><option value="account">ورود و ثبت‌نام</option><option value="courses">دوره‌ها و درس‌ها</option><option value="payments">پرداخت و سفارش</option><option value="meditation">مدیتیشن</option><option value="chakra">پاکسازی چاکراها</option><option value="kundalini">بیداری کندالینی</option><option value="fengshui">فنگ‌شویی</option><option value="education">سؤال آموزشی و معنوی</option><option value="feedback">پیشنهاد و انتقاد</option><option value="technical">مشکل فنی</option><option value="other">سایر موارد</option></select></label>
<label>نوع فرستنده<select id="filterSender"><option value="all">همه فرستنده‌ها</option><option value="student">هنرجوی ثبت‌نام‌شده</option><option value="guest">بازدیدکننده مهمان</option></select></label>
<label>جست‌وجو<input id="search" type="search" placeholder="نام، ایمیل یا کد پیگیری"></label>
</div>
<button id="refresh">بروزرسانی فهرست</button><p id="status" class="status"></p><div id="tickets"></div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://zowmefbbhowjyozynpay.supabase.co','sb_publishable_iz-in_P7bzRwgbx6SlSdaA_sK6-EyUS');
const $=id=>document.getElementById(id);let ready=false,allTickets=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const categories={account:'ورود و ثبت‌نام',courses:'دوره‌ها و درس‌ها',payments:'پرداخت و سفارش',meditation:'مدیتیشن',chakra:'پاکسازی چاکراها',kundalini:'بیداری کندالینی',fengshui:'فنگ‌شویی',education:'سؤال آموزشی و معنوی',feedback:'پیشنهاد و انتقاد',technical:'مشکل فنی',other:'سایر موارد'};
async function init(){const{data,error}=await sb.auth.getSession();if(error||!data.session){location.replace('login.html');return}const{data:p,error:pe}=await sb.from('profiles').select('role').eq('id',data.session.user.id).single();if(pe||p?.role!=='admin'){await sb.auth.signOut();location.replace('login.html');return}ready=true;load()}
async function load(){if(!ready)return;$('status').textContent='در حال دریافت درخواست‌ها...';$('tickets').replaceChildren();const{data,error}=await sb.from('support_tickets').select('*').order('created_at',{ascending:false}).limit(300);if(error){$('status').textContent='خطا: '+error.message;return}allTickets=data||[];render()}
function render(){const status=$('filterStatus').value,category=$('filterCategory').value,sender=$('filterSender').value,term=$('search').value.trim().toLocaleLowerCase();const rows=allTickets.filter(t=>(status==='all'||t.status===status)&&(category==='all'||(t.category||'other')===category)&&(sender==='all'||(sender==='student'?!!t.user_id:!t.user_id))&&(!term||[t.visitor_name,t.visitor_email,t.ticket_code].some(v=>String(v||'').toLocaleLowerCase().includes(term))));$('status').textContent=rows.length+' درخواست از '+allTickets.length+' درخواست';$('tickets').replaceChildren();for(const t of rows){const el=document.createElement('section');el.className='ticket';const senderLabel=t.user_id?'هنرجوی ثبت‌نام‌شده':'بازدیدکننده مهمان';el.innerHTML='<div class="ticket-head"><strong>'+esc(t.subject)+'</strong><span class="pill">'+esc(senderLabel)+'</span></div><div class="meta">کد: '+esc(t.ticket_code)+' | '+new Date(t.created_at).toLocaleString('fa-IR')+' | '+esc(t.visitor_name||'بدون نام')+' | '+esc(t.visitor_email||'بدون ایمیل')+'</div><div class="meta">موضوع: '+esc(categories[t.category]||categories.other)+' | '+(t.user_id?'حساب کاربری متصل':'بدون حساب کاربری')+'</div><div class="message">'+esc(t.message)+'</div><label>پاسخ مدرس</label><textarea data-reply placeholder="پاسخ را بنویس...">'+esc(t.admin_reply||'')+'</textarea><label>وضعیت درخواست</label><select data-status><option value="open">جدید</option><option value="in_progress">در حال بررسی</option><option value="answered">پاسخ داده‌شده</option><option value="closed">بسته‌شده</option></select><button data-save>ذخیره پاسخ و وضعیت</button> <span class="meta" data-result></span>';el.querySelector('[data-status]').value=t.status;el.querySelector('[data-save]').addEventListener('click',async()=>{const reply=el.querySelector('[data-reply]').value.trim(),newStatus=el.querySelector('[data-status]').value,result=el.querySelector('[data-result]');result.textContent='در حال ذخیره...';const{error}=await sb.from('support_tickets').update({admin_reply:reply||null,status:newStatus,replied_at:reply?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',t.id);result.textContent=error?'خطا: '+error.message:'ذخیره شد';if(!error){t.admin_reply=reply||null;t.status=newStatus;t.replied_at=reply?new Date().toISOString():null;render()}});$('tickets').append(el)}}
$('refresh').addEventListener('click',load);['filterStatus','filterCategory','filterSender'].forEach(id=>$(id).addEventListener('change',render));$('search').addEventListener('input',render);init();
</script></body></html>
