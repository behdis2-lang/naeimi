<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت پشتیبانی | آکادمی</title>
<style>
:root{--cream:#f6efdf;--paper:#fffaf0;--gold:#a87928;--brown:#705638;--ink:#403426;--muted:#796b58;--line:#e8dcc7}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px/2 Tahoma,Arial}header{background:var(--paper);padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.wrap{max-width:1000px;margin:25px auto;padding:0 14px}h1{font-size:21px;color:var(--brown)}.ticket{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:17px;margin:13px 0}.meta{font-size:12px;color:var(--muted)}.message{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8f1e4;padding:12px;border-radius:9px;margin:12px 0}textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:white;font:13px Tahoma;margin:5px 0 10px}button{background:var(--gold);color:white;border:0;border-radius:8px;padding:10px 16px;font:13px Tahoma;cursor:pointer;margin:4px}.status{color:var(--brown);white-space:pre-wrap}.row{display:grid;grid-template-columns:1fr 180px;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body>
<header><strong>✧ مدیریت درخواست‌های پشتیبانی</strong><a href="admin.html" style="color:var(--brown)">بازگشت به مدیریت ←</a></header>
<main class="wrap"><h1>پیام‌های بازدیدکنندگان و هنرجویان</h1><p class="meta">این صفحه فقط برای مدیر سامانه قابل دسترسی است. پاسخ‌ها پس از ذخیره در پرونده درخواست ثبت می‌شوند.</p>
<div class="row"><select id="filter"><option value="all">همه درخواست‌ها</option><option value="open">جدید</option><option value="in_progress">در حال بررسی</option><option value="answered">پاسخ داده‌شده</option><option value="closed">بسته‌شده</option></select><button id="refresh">بروزرسانی فهرست</button></div>
<p id="status" class="status"></p><div id="tickets"></div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://zowmefbbhowjyozynpay.supabase.co','sb_publishable_iz-in_P7bzRwgbx6SlSdaA_sK6-EyUS');
const $=id=>document.getElementById(id);let ready=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){const {data,error}=await sb.auth.getSession();if(error||!data.session){location.replace('login.html');return}const {data:p,error:pe}=await sb.from('profiles').select('role').eq('id',data.session.user.id).single();if(pe||p?.role!=='admin'){await sb.auth.signOut();location.replace('login.html');return}ready=true;load()}
async function load(){if(!ready)return;$('status').textContent='در حال دریافت درخواست‌ها...';$('tickets').replaceChildren();let q=sb.from('support_tickets').select('*').order('created_at',{ascending:false}).limit(100);const f=$('filter').value;if(f!=='all')q=q.eq('status',f);const{data,error}=await q;if(error){$('status').textContent='خطا: '+error.message;return}$('status').textContent=(data?.length||0)+' درخواست';for(const t of data||[]){const el=document.createElement('section');el.className='ticket';el.innerHTML='<strong>'+esc(t.subject)+'</strong><div class="meta">کد: '+esc(t.ticket_code)+' | '+new Date(t.created_at).toLocaleString('fa-IR')+' | '+esc(t.visitor_name||'بدون نام')+' | '+esc(t.visitor_email||'بدون ایمیل')+'</div><div class="message">'+esc(t.message)+'</div><label>پاسخ مدرس</label><textarea data-reply placeholder="پاسخ را بنویس...">'+esc(t.admin_reply||'')+'</textarea><label>وضعیت درخواست</label><select data-status><option value="open">جدید</option><option value="in_progress">در حال بررسی</option><option value="answered">پاسخ داده‌شده</option><option value="closed">بسته‌شده</option></select><button data-save>ذخیره پاسخ و وضعیت</button><span class="meta" data-result></span>';el.querySelector('[data-status]').value=t.status;el.querySelector('[data-save]').addEventListener('click',async()=>{const reply=el.querySelector('[data-reply]').value.trim(),status=el.querySelector('[data-status]').value;const result=el.querySelector('[data-result]');result.textContent='در حال ذخیره...';const{error}=await sb.from('support_tickets').update({admin_reply:reply||null,status,replied_at:reply?new Date().toISOString():null,updated_at:new Date().toISOString()}).eq('id',t.id);result.textContent=error?'خطا: '+error.message:'ذخیره شد';if(!error&&$('filter').value!=='all'&&status!==$('filter').value)el.remove()});$('tickets').append(el)}}
$('refresh').addEventListener('click',load);$('filter').addEventListener('change',load);init();
</script></body></html>
